<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Beasiswaku</title>
<style>
:root{--langit:#E8F1F6;--tinta:#10263F;--laut:#0F6B73;--kunyit:#F2B01E;--abu:#5A6B7B;--garis:#C9D8E2;--merah:#B4361F}
*{box-sizing:border-box}
body{margin:0;background:var(--langit);color:var(--tinta);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
header{background:var(--tinta);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{font-size:1.15rem}
header a,header button{color:#fff;font:inherit;background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}
.panel{background:#fff;border-radius:12px;padding:22px;margin-bottom:24px}
h1,h2{margin:0 0 14px;line-height:1.2}
h2{font-size:1.3rem}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.95rem}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--garis);border-radius:8px;font:inherit;color:var(--tinta);background:#fff}
textarea{min-height:90px;resize:vertical}
.baris{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.cek{display:flex;gap:16px;flex-wrap:wrap}
.cek label{display:flex;gap:6px;align-items:center;font-weight:500;margin:4px 0}
button.utama,button.sekunder,button.bahaya{font:600 .95rem inherit;font-family:inherit;padding:10px 18px;border-radius:8px;border:0;cursor:pointer}
button.utama{background:var(--tinta);color:#fff}
button.utama:hover{background:var(--laut)}
button.sekunder{background:var(--langit);color:var(--tinta)}
button.bahaya{background:#fff;color:var(--merah);border:1.5px solid var(--merah);padding:6px 12px}
button:disabled{opacity:.6;cursor:wait}
.aksi{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.pesan{margin:12px 0 0;min-height:1.4em;font-weight:500}
.pesan.err{color:var(--merah)}
.pesan.ok{color:var(--laut)}
.item{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--garis)}
.item:first-child{border-top:0}
.item h3{margin:0;font-size:1.05rem}
.item small{color:var(--abu)}
.item .tombol{display:flex;gap:8px;flex-shrink:0}
.sembunyi{display:none}
@media (max-width:620px){.baris{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <strong>Admin Beasiswaku</strong>
  <span><a href="index.html">Lihat situs</a> <span id="akun"></span> <button type="button" id="keluar" class="sembunyi">Keluar</button></span>
</header>

<div class="wrap">
  <!-- Masuk -->
  <section class="panel" id="panelMasuk">
    <h1>Masuk</h1>
    <form id="formMasuk">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="sandi">Kata sandi</label>
      <input id="sandi" type="password" autocomplete="current-password" required>
      <div class="aksi"><button class="utama" type="submit">Masuk</button></div>
      <p class="pesan" id="pesanMasuk" role="status"></p>
    </form>
  </section>

  <!-- Kelola -->
  <div id="panelAdmin" class="sembunyi">
    <section class="panel">
      <h2 id="judulForm">Tambah beasiswa</h2>
      <form id="form">
        <input type="hidden" id="id">
        <label for="nama">Nama beasiswa</label>
        <input id="nama" type="text" required>
        <label for="penyelenggara">Penyelenggara</label>
        <input id="penyelenggara" type="text" required>
        <label for="deskripsi">Deskripsi singkat</label>
        <textarea id="deskripsi"></textarea>
        <label>Jenjang</label>
        <div class="cek" id="jenjang">
          <label><input type="checkbox" value="S1"> S1</label>
          <label><input type="checkbox" value="S2"> S2</label>
          <label><input type="checkbox" value="S3"> S3</label>
        </div>
        <div class="baris">
          <div>
            <label for="lokasi">Lokasi</label>
            <select id="lokasi"><option>Dalam negeri</option><option>Luar negeri</option></select>
          </div>
          <div>
            <label for="negara">Negara tujuan</label>
            <input id="negara" type="text" placeholder="Contoh: Jepang">
          </div>
          <div>
            <label for="tutup">Tanggal tutup</label>
            <input id="tutup" type="date" required>
          </div>
          <div>
            <label for="url">Tautan situs resmi</label>
            <input id="url" type="url" placeholder="https://" required>
          </div>
        </div>
        <div class="aksi">
          <button class="utama" type="submit" id="simpan">Simpan</button>
          <button class="sekunder sembunyi" type="button" id="batal">Batal ubah</button>
        </div>
        <p class="pesan" id="pesanForm" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Daftar beasiswa</h2>
      <div id="daftar"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const cfg = window.BEASISWAKU_CONFIG || {};
const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);
let data = [];

function el(tag, cls, teks){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (teks !== undefined) e.textContent = teks;
  return e;
}
function pesan(node, teks, jenis){
  node.textContent = teks || "";
  node.className = "pesan" + (jenis ? " " + jenis : "");
}
function tglIndo(t){
  const [y,m,d] = t.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
}

/* ---------- Sesi & hak akses ---------- */
async function periksaSesi(){
  const { data: { session } } = await db.auth.getSession();
  if (!session){ tampil(false); return; }
  const { data: baris, error } = await db.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (error || !baris){
    await db.auth.signOut();
    tampil(false);
    pesan($("#pesanMasuk"), "Akun ini bukan admin.", "err");
    return;
  }
  $("#akun").textContent = "· " + session.user.email;
  tampil(true);
  muatDaftar();
}
function tampil(admin){
  $("#panelMasuk").classList.toggle("sembunyi", admin);
  $("#panelAdmin").classList.toggle("sembunyi", !admin);
  $("#keluar").classList.toggle("sembunyi", !admin);
  if (!admin) $("#akun").textContent = "";
}

$("#formMasuk").addEventListener("submit", async (e) => {
  e.preventDefault();
  pesan($("#pesanMasuk"), "Memeriksa…");
  const { error } = await db.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#sandi").value });
  if (error){ pesan($("#pesanMasuk"), "Email atau kata sandi salah.", "err"); return; }
  $("#sandi").value = "";
  pesan($("#pesanMasuk"), "");
  periksaSesi();
});
$("#keluar").addEventListener("click", async () => { await db.auth.signOut(); tampil(false); });

/* ---------- Daftar ---------- */
async function muatDaftar(){
  const { data: hasil, error } = await db.from("beasiswa").select("*").order("tutup");
  const box = $("#daftar");
  box.replaceChildren();
  if (error){ box.append(el("p","pesan err","Gagal memuat daftar.")); return; }
  data = hasil;
  if (!data.length){ box.append(el("p","", "Belum ada beasiswa. Tambahkan lewat formulir di atas.")); return; }
  for (const b of data){
    const row = el("div","item");
    const info = el("div");
    info.append(el("h3","", b.nama), el("small","", `${b.penyelenggara} · ${b.jenjang.join(", ")} · tutup ${tglIndo(b.tutup)}`));
    const tombol = el("div","tombol");
    const ubah = el("button","sekunder","Ubah"); ubah.type = "button";
    ubah.addEventListener("click", () => isiForm(b));
    const hapus = el("button","bahaya","Hapus"); hapus.type = "button";
    hapus.addEventListener("click", () => hapusItem(b));
    tombol.append(ubah, hapus);
    row.append(info, tombol);
    box.append(row);
  }
}

/* ---------- Form tambah / ubah ---------- */
function kosongkanForm(){
  $("#form").reset();
  $("#id").value = "";
  $("#judulForm").textContent = "Tambah beasiswa";
  $("#batal").classList.add("sembunyi");
}
function isiForm(b){
  $("#id").value = b.id;
  $("#nama").value = b.nama;
  $("#penyelenggara").value = b.penyelenggara;
  $("#deskripsi").value = b.deskripsi;
  $("#lokasi").value = b.lokasi;
  $("#negara").value = b.negara;
  $("#tutup").value = b.tutup;
  $("#url").value = b.url;
  document.querySelectorAll("#jenjang input").forEach(c => c.checked = b.jenjang.includes(c.value));
  $("#judulForm").textContent = "Ubah beasiswa";
  $("#batal").classList.remove("sembunyi");
  pesan($("#pesanForm"), "");
  $("#judulForm").scrollIntoView({behavior:"smooth", block:"start"});
}
$("#batal").addEventListener("click", () => { kosongkanForm(); pesan($("#pesanForm"), ""); });

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const jenjang = [...document.querySelectorAll("#jenjang input:checked")].map(c => c.value);
  if (!jenjang.length){ pesan($("#pesanForm"), "Pilih minimal satu jenjang.", "err"); return; }
  const baris = {
    nama: $("#nama").value.trim(),
    penyelenggara: $("#penyelenggara").value.trim(),
    deskripsi: $("#deskripsi").value.trim(),
    jenjang,
    lokasi: $("#lokasi").value,
    negara: $("#negara").value.trim(),
    tutup: $("#tutup").value,
    url: $("#url").value.trim()
  };
  const id = $("#id").value;
  $("#simpan").disabled = true;
  pesan($("#pesanForm"), "Menyimpan…");
  const { error } = id
    ? await db.from("beasiswa").update(baris).eq("id", id)
    : await db.from("beasiswa").insert(baris);
  $("#simpan").disabled = false;
  if (error){ pesan($("#pesanForm"), "Gagal menyimpan: " + error.message, "err"); return; }
  pesan($("#pesanForm"), id ? "Perubahan tersimpan." : "Beasiswa ditambahkan.", "ok");
  kosongkanForm();
  muatDaftar();
});

async function hapusItem(b){
  if (!confirm(`Hapus “${b.nama}”? Tindakan ini tidak bisa dibatalkan.`)) return;
  const { error } = await db.from("beasiswa").delete().eq("id", b.id);
  if (error){ pesan($("#pesanForm"), "Gagal menghapus: " + error.message, "err"); return; }
  pesan($("#pesanForm"), `“${b.nama}” dihapus.`, "ok");
  muatDaftar();
}

periksaSesi();
</script>
</body>
</html>
